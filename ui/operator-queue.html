<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PebbleFlow IDP VHMI - My Queue</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-primary: #031634;
            --color-primary-hover: #1A2B4A;
            --color-primary-light: #f2f4f6;
            --color-background: #f8f9fb;
            --color-surface: #f2f4f6;
            --color-text-primary: #031634;
            --color-text-secondary: #44474e;
            --color-border: #e1e2e4;
            --color-success: #415e92;
            --color-warning: #4e5e80;
            --color-error: #ba1a1a;
            --font-sans: 'Inter', system-ui, sans-serif;
            --radius-DEFAULT: 8px;
        }

        @layer base {
            body {
                @apply bg-[#f9fafb] text-text-primary font-sans antialiased m-0 h-screen w-screen overflow-hidden flex;
            }
        }
    </style>
</head>

<body class="bg-[#f9fafb] text-text-primary font-sans antialiased m-0 h-screen w-screen overflow-hidden flex">

    <!-- Sidebar -->
    <div class="flex h-full w-64 flex-col border-r border-border bg-background shrink-0">
        <div class="flex h-16 shrink-0 items-center px-6 border-b border-border">
            <div class="flex items-center">
                <img src="SVI_logo/alembic-for-light-bg.png" alt="SVI Alembic logo" class="h-8 w-auto object-contain" />
            </div>
        </div>

        <div class="flex flex-1 flex-col overflow-y-auto px-3 py-6">
            <nav class="flex-1 space-y-1">
                <a href="operator-queue.html"
                    class="group flex items-center px-3 py-2 text-sm font-medium rounded-md w-full border-l-4 transition-colors bg-primary-light text-primary border-primary">
                    <svg class="mr-3 h-5 w-5 shrink-0" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/></svg>
                    My Queue
                </a>
                <a href="approvals-queue.html"
                    class="group flex items-center px-3 py-2 text-sm font-medium rounded-md w-full border-l-4 transition-colors border-transparent text-text-secondary hover:bg-surface hover:text-text-primary">
                    <svg class="mr-3 h-5 w-5 shrink-0" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                    Approvals
                </a>
                <a href="dashboard.html"
                    class="group flex items-center px-3 py-2 text-sm font-medium rounded-md w-full border-l-4 transition-colors border-transparent text-text-secondary hover:bg-surface hover:text-text-primary">
                    <svg class="mr-3 h-5 w-5 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
                    Dashboard
                </a>
                <a href="canvas-editor.html"
                    class="group flex items-center px-3 py-2 text-sm font-medium rounded-md w-full border-l-4 transition-colors border-transparent text-text-secondary hover:bg-surface hover:text-text-primary">
                    <svg class="mr-3 h-5 w-5 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M6 9v6a3 3 0 0 0 3 3h6"/></svg>
                    Workflow
                </a>
                <a href="metrics.html"
                    class="group flex items-center px-3 py-2 text-sm font-medium rounded-md w-full border-l-4 transition-colors border-transparent text-text-secondary hover:bg-surface hover:text-text-primary">
                    <svg class="mr-3 h-5 w-5 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>
                    Metrics
                </a>
                <a href="flywheel.html"
                    class="group flex items-center px-3 py-2 text-sm font-medium rounded-md w-full border-l-4 transition-colors border-transparent text-text-secondary hover:bg-surface hover:text-text-primary">
                    <svg class="mr-3 h-5 w-5 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    Flywheel
                </a>
            </nav>
        </div>

        <div class="border-t border-border p-4">
            <div class="flex items-center gap-3">
                <div class="h-9 w-9 rounded-full bg-surface border border-border flex items-center justify-center text-sm font-medium text-text-primary">JD</div>
                <div class="flex flex-col">
                    <span class="text-sm font-medium text-text-primary">John Doe</span>
                    <span class="text-xs text-text-secondary">Operator</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0 bg-[#f9fafb]">
        <!-- Header -->
        <header class="flex h-16 shrink-0 items-center justify-between border-b border-border bg-background px-8">
            <div class="flex items-center gap-3">
                <h1 class="text-lg font-bold uppercase tracking-wide text-text-primary drop-shadow-sm">MY QUEUE</h1>
                <span class="text-xs text-text-secondary font-medium bg-surface border border-border rounded px-2 py-0.5">Assigned to AP Team</span>
            </div>
            <input id="new-case-input" type="file" accept="application/pdf" class="hidden">
            <button id="new-case-btn" type="button"
                class="bg-primary hover:bg-primary-hover text-white flex items-center gap-2 px-5 font-bold tracking-wide h-10 text-sm transition-colors rounded disabled:opacity-60 disabled:cursor-progress">
                <svg id="new-case-icon" class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                <span id="new-case-label">NEW CASE</span>
            </button>
        </header>

        <div class="flex-1 p-8 overflow-y-auto">
            <div class="max-w-7xl mx-auto space-y-6">

                <!-- Filters -->
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2 text-sm">
                        <span class="text-text-secondary font-medium text-xs uppercase tracking-wider">Filter By:</span>
                        <div class="flex items-center border border-border bg-white rounded gap-2 px-3 py-1.5 cursor-pointer hover:bg-surface text-sm">
                            Workflow: All
                            <svg class="w-4 h-4 text-text-secondary" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                        </div>
                        <select id="state-filter" class="border border-border bg-white rounded px-3 py-1.5 hover:bg-surface text-sm cursor-pointer focus:outline-none focus:ring-1 focus:ring-primary">
                            <option value="">Status: All</option>
                            <option value="pending_review">Pending Review</option>
                            <option value="pending_approval_L1">Awaiting Approval</option>
                            <option value="integration_error">Integration Error</option>
                            <option value="complete">Complete</option>
                            <option value="rejected">Rejected</option>
                        </select>
                        <label class="flex items-center gap-2 ml-4 cursor-pointer">
                            <input type="checkbox" checked class="h-4 w-4 rounded border-border text-primary focus:ring-primary">
                            <span class="text-text-secondary text-xs font-medium uppercase tracking-wider">Assigned to me</span>
                        </label>
                    </div>
                    <div class="relative">
                        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-text-secondary" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                        <input type="text" placeholder="Search my queue..." class="pl-9 pr-4 py-2 border border-border rounded w-64 text-sm focus:outline-none focus:ring-1 focus:ring-primary h-10" />
                    </div>
                </div>

                <!-- Table -->
                <div class="bg-white rounded-lg border border-border shadow-sm overflow-hidden">
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="border-b border-border bg-surface text-left">
                                <th class="px-4 py-3 text-[10px] font-semibold uppercase tracking-widest text-text-secondary">Case ID</th>
                                <th class="px-4 py-3 text-[10px] font-semibold uppercase tracking-widest text-text-secondary">Title (Subject / Context)</th>
                                <th class="px-4 py-3 text-[10px] font-semibold uppercase tracking-widest text-text-secondary">Current Stage</th>
                                <th class="px-4 py-3 text-[10px] font-semibold uppercase tracking-widest text-text-secondary">Status</th>
                                <th class="px-4 py-3 text-[10px] font-semibold uppercase tracking-widest text-text-secondary">Due Date</th>
                                <th class="px-4 py-3 text-[10px] font-semibold uppercase tracking-widest text-text-secondary"></th>
                            </tr>
                        </thead>
                        <tbody id="queue-rows" class="divide-y divide-border">
                            <tr><td colspan="6" class="px-4 py-8 text-center text-text-secondary text-sm">Loading…</td></tr>
                        </tbody>
                    </table>

                    <!-- Pagination -->
                    <div class="flex items-center justify-between px-4 py-3 border-t border-border bg-surface/40">
                        <span id="queue-count" class="text-xs text-text-secondary">&nbsp;</span>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Extraction progress overlay -->
    <div id="extract-overlay" class="hidden fixed inset-0 z-50 bg-primary/95 backdrop-blur-sm flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-2xl border border-border w-full max-w-xl p-8">
            <div class="flex items-center gap-3 mb-1">
                <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center">
                    <svg class="w-6 h-6 text-primary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4"/><path d="M12 18v4"/><path d="m4.93 4.93 2.83 2.83"/><path d="m16.24 16.24 2.83 2.83"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="m4.93 19.07 2.83-2.83"/><path d="m16.24 7.76 2.83-2.83"/></svg>
                </div>
                <div class="flex-1">
                    <div class="text-xs uppercase font-bold tracking-widest text-text-secondary">Processing new case</div>
                    <div id="extract-filename" class="text-base font-bold text-text-primary truncate">—</div>
                </div>
                <span id="extract-mode-badge" class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded border bg-surface text-text-secondary border-border">…</span>
            </div>

            <div id="extract-stages" class="mt-6 space-y-3">
                <!-- stages injected here -->
            </div>

            <div id="extract-result" class="hidden mt-6 p-4 rounded-lg bg-emerald-50 border border-emerald-200 text-sm text-emerald-800">
                <div class="font-bold">Extraction complete</div>
                <div id="extract-result-detail" class="text-emerald-700 mt-0.5">—</div>
            </div>

            <div id="extract-error" class="hidden mt-6 p-4 rounded-lg bg-red-50 border border-red-200 text-sm text-red-800">
                <div class="font-bold">Extraction failed</div>
                <div id="extract-error-detail" class="text-red-700 mt-0.5">—</div>
                <button id="extract-error-close" class="mt-3 text-xs bg-white border border-border rounded px-3 py-1 hover:bg-surface">Close</button>
            </div>
        </div>
    </div>

    <script>
        const STATE_LABEL = {
            pending_review: { stage: "Manual Verify", status: "Pending Review", pill: "orange", action: "OPEN CASE" },
            pending_approval_L1: { stage: "Manager Approval", status: "Awaiting Approval", pill: "amber", action: "CONTINUE →" },
            integration_error: { stage: "Integration", status: "ERP Error", pill: "red", action: "REVIEW" },
            complete: { stage: "Done", status: "Complete", pill: "green", action: "VIEW" },
            rejected: { stage: "Done", status: "Rejected", pill: "gray", action: "VIEW" },
        };
        const PILL_CLASS = {
            orange: "bg-orange-50 text-orange-700 border-orange-200",
            amber: "bg-amber-50 text-amber-700 border-amber-200",
            red: "bg-red-50 text-red-700 border-red-200",
            green: "bg-emerald-50 text-emerald-700 border-emerald-200",
            gray: "bg-gray-50 text-gray-600 border-gray-200",
        };
        const DOT_CLASS = {
            orange: "bg-orange-500",
            amber: "bg-amber-500",
            red: "bg-red-500",
            green: "bg-emerald-500",
            gray: "bg-gray-400",
        };

        const escapeHtml = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        const shortId = (id) => id ? id.replace(/^case_/, "").slice(0, 8).toUpperCase() : "";
        const formatDate = (iso) => {
            if (!iso) return "";
            const d = new Date(iso);
            return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
        };

        function renderRow(c) {
            const meta = STATE_LABEL[c.state] || { stage: c.state, status: c.state, pill: "gray", action: "OPEN" };
            const subject = escapeHtml(c.subject || "(untitled)");
            const docCount = c.doc_count ?? 0;
            const conf = c.overall_confidence != null ? `${Math.round(c.overall_confidence * 100)}% confidence` : "";
            const subline = [`${docCount} doc${docCount === 1 ? "" : "s"}`, conf].filter(Boolean).join(" · ");
            const isError = c.state === "integration_error";
            return `
                <tr class="hover:bg-surface/50 transition-colors cursor-pointer ${isError ? "bg-red-50/30" : ""}" data-case-id="${escapeHtml(c.case_id)}">
                    <td class="px-4 py-3 font-mono text-xs text-text-secondary">${escapeHtml(shortId(c.case_id))}</td>
                    <td class="px-4 py-3">
                        <div class="font-bold text-text-primary">${subject}</div>
                        <div class="text-xs text-text-secondary">${escapeHtml(subline)}</div>
                    </td>
                    <td class="px-4 py-3 text-text-primary">${escapeHtml(meta.stage)}</td>
                    <td class="px-4 py-3">
                        <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded text-xs font-medium border ${PILL_CLASS[meta.pill]}">
                            <span class="w-1.5 h-1.5 rounded-full inline-block ${DOT_CLASS[meta.pill]}"></span>
                            ${escapeHtml(meta.status)}
                        </span>
                    </td>
                    <td class="px-4 py-3 text-text-secondary text-xs">${escapeHtml(formatDate(c.created_at))}</td>
                    <td class="px-4 py-3 text-right">
                        <div class="flex items-center gap-2 justify-end">
                            <a href="case-detail.html?id=${encodeURIComponent(c.case_id)}" class="bg-primary/10 hover:bg-primary/20 text-primary px-4 py-1.5 rounded font-bold text-xs transition-colors">${escapeHtml(meta.action)}</a>
                            <button data-reset-id="${escapeHtml(c.case_id)}" class="text-text-secondary hover:text-error border border-border hover:border-error/40 px-2 py-1.5 rounded text-[10px] font-bold uppercase tracking-wider transition-colors" title="Reset case for demo">↺</button>
                        </div>
                    </td>
                </tr>`;
        }

        async function resetCase(caseId) {
            if (!confirm(`Reset case ${caseId.slice(-8).toUpperCase()} back to Pending Review?\n\nThis will also clear all verdicts and actions from your browser.`)) return;
            try {
                const r = await fetch(`/api/cases/${encodeURIComponent(caseId)}/reset`, { method: "POST" });
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                // Clear localStorage state for this case
                localStorage.removeItem(`svi_verdicts_${caseId}`);
                localStorage.removeItem(`svi_actions_${caseId}`);
                await loadQueue();
            } catch (e) {
                alert(`Reset failed: ${e.message}`);
            }
        }

        async function loadQueue() {
            const tbody = document.getElementById("queue-rows");
            const countEl = document.getElementById("queue-count");
            const state = document.getElementById("state-filter").value;
            const url = state ? `/api/cases?state=${encodeURIComponent(state)}` : "/api/cases";
            tbody.innerHTML = `<tr><td colspan="6" class="px-4 py-8 text-center text-text-secondary text-sm">Loading…</td></tr>`;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const cases = data.cases || [];
                if (cases.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="px-4 py-8 text-center text-text-secondary text-sm">No cases${state ? ` in this state` : ""}.</td></tr>`;
                    countEl.textContent = "Showing 0 of 0 tasks";
                    return;
                }
                tbody.innerHTML = cases.map(renderRow).join("");
                const total = data.total ?? cases.length;
                countEl.textContent = `Showing ${cases.length} of ${total} task${total === 1 ? "" : "s"}`;
                tbody.querySelectorAll("tr[data-case-id]").forEach((tr) => {
                    tr.addEventListener("click", (e) => {
                        if (e.target.closest("a")) return;
                        if (e.target.closest("[data-reset-id]")) return;
                        location.href = `case-detail.html?id=${encodeURIComponent(tr.dataset.caseId)}`;
                    });
                });
                tbody.querySelectorAll("[data-reset-id]").forEach((btn) => {
                    btn.addEventListener("click", (e) => {
                        e.stopPropagation();
                        resetCase(btn.dataset.resetId);
                    });
                });
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="6" class="px-4 py-8 text-center text-error text-sm">Failed to load queue: ${escapeHtml(err.message)}</td></tr>`;
                countEl.textContent = "";
            }
        }

        document.getElementById("state-filter").addEventListener("change", loadQueue);

        // ----- NEW CASE upload + extraction overlay -----
        const fileInput = document.getElementById("new-case-input");
        const newCaseBtn = document.getElementById("new-case-btn");
        const newCaseLabel = document.getElementById("new-case-label");
        const overlay = document.getElementById("extract-overlay");
        const stagesEl = document.getElementById("extract-stages");
        const filenameEl = document.getElementById("extract-filename");
        const modeBadge = document.getElementById("extract-mode-badge");
        const resultEl = document.getElementById("extract-result");
        const resultDetailEl = document.getElementById("extract-result-detail");
        const errorEl = document.getElementById("extract-error");
        const errorDetailEl = document.getElementById("extract-error-detail");

        const STAGES = [
            { id: "upload",   label: "Uploading file",                   detail: "" },
            { id: "classify", label: "Classifying document",             detail: "Detecting Invoice / Faktur Pajak boundaries" },
            { id: "invoice",  label: "Extracting Commercial Invoice",    detail: "schema_invoice_v1" },
            { id: "faktur",   label: "Extracting Faktur Pajak",          detail: "schema_faktur_pajak_v1" },
            { id: "create",   label: "Creating case + assigning queue",  detail: "" },
        ];
        let CURRENT_STAGE = -1;

        function renderStages() {
            stagesEl.innerHTML = STAGES.map((s, i) => `
                <div data-stage="${s.id}" class="flex items-start gap-3 p-3 rounded-lg border border-border bg-surface/40">
                    <div data-icon class="w-6 h-6 rounded-full border-2 border-border bg-white flex items-center justify-center shrink-0 mt-0.5">
                        <span class="text-xs font-bold text-text-secondary">${i + 1}</span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div data-label class="font-bold text-text-secondary">${s.label}</div>
                        <div data-detail class="text-xs text-text-secondary/70 mt-0.5">${s.detail}</div>
                    </div>
                </div>
            `).join("");
        }

        function setStage(idx, status, extraDetail) {
            const stage = STAGES[idx];
            if (!stage) return;
            const row = stagesEl.querySelector(`[data-stage="${stage.id}"]`);
            if (!row) return;
            const iconBox = row.querySelector("[data-icon]");
            const label = row.querySelector("[data-label]");
            const detail = row.querySelector("[data-detail]");

            if (status === "active") {
                row.className = "flex items-start gap-3 p-3 rounded-lg border border-primary bg-primary/5";
                iconBox.className = "w-6 h-6 rounded-full border-2 border-primary bg-white flex items-center justify-center shrink-0 mt-0.5";
                iconBox.innerHTML = `<svg class="w-3.5 h-3.5 text-primary animate-spin" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>`;
                label.className = "font-bold text-text-primary";
            } else if (status === "done") {
                row.className = "flex items-start gap-3 p-3 rounded-lg border border-emerald-300 bg-emerald-50/60";
                iconBox.className = "w-6 h-6 rounded-full bg-emerald-500 flex items-center justify-center shrink-0 mt-0.5";
                iconBox.innerHTML = `<svg class="w-3.5 h-3.5 text-white" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`;
                label.className = "font-bold text-emerald-800";
            }
            if (extraDetail) detail.textContent = extraDetail;
        }

        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

        async function detectExtractionMode() {
            // Probe via the upload's resulting case timing — we don't know
            // mode upfront, so badge starts neutral and we update once we
            // see the response.
            modeBadge.textContent = "EXTRACTING…";
            modeBadge.className = "text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded border bg-amber-50 text-amber-700 border-amber-200";
        }

        function setModeBadge(elapsedMs) {
            // Heuristic: real Gemini takes >2s per doc, stub <500ms total.
            if (elapsedMs > 4000) {
                modeBadge.textContent = "REAL · GEMINI";
                modeBadge.className = "text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded border bg-emerald-50 text-emerald-700 border-emerald-200";
            } else {
                modeBadge.textContent = "STUB MODE";
                modeBadge.className = "text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded border bg-gray-50 text-gray-600 border-gray-200";
            }
        }

        async function animateUntilFlag(stageIdx, flag, minMs, maxMs) {
            // Hold on a stage either for minMs, or until flag.done becomes true,
            // whichever is later (capped at maxMs to avoid stalling forever).
            const start = Date.now();
            setStage(stageIdx, "active");
            while (true) {
                const elapsed = Date.now() - start;
                if (flag.done && elapsed >= minMs) break;
                if (elapsed >= maxMs) break;
                await sleep(80);
            }
            setStage(stageIdx, "done");
        }

        newCaseBtn.addEventListener("click", () => fileInput.click());
        fileInput.addEventListener("change", async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            newCaseBtn.disabled = true;

            // Show overlay
            filenameEl.textContent = file.name;
            renderStages();
            CURRENT_STAGE = -1;
            resultEl.classList.add("hidden");
            errorEl.classList.add("hidden");
            overlay.classList.remove("hidden");
            await detectExtractionMode();

            // Start real upload
            const fd = new FormData();
            fd.append("file", file);
            const uploadFlag = { done: false, data: null, error: null, elapsedMs: 0 };
            const uploadStart = Date.now();
            fetch("/api/cases/upload", { method: "POST", body: fd })
                .then(async (res) => {
                    if (!res.ok) {
                        const txt = await res.text();
                        throw new Error(`HTTP ${res.status}: ${txt.slice(0, 200)}`);
                    }
                    uploadFlag.data = await res.json();
                })
                .catch((err) => { uploadFlag.error = err; })
                .finally(() => {
                    uploadFlag.elapsedMs = Date.now() - uploadStart;
                    uploadFlag.done = true;
                });

            try {
                // Stage 1: upload (real fast — minimum 800ms for visual feedback)
                await animateUntilFlag(0, { done: true }, 700, 1500);
                if (uploadFlag.error) throw uploadFlag.error;

                // Stage 2: classify (synthetic but believable)
                await animateUntilFlag(1, { done: true }, 1100, 4000);
                if (uploadFlag.error) throw uploadFlag.error;

                // Stage 3: extract invoice — pace through OR wait for upload
                // We split remaining wait roughly equally between invoice + faktur
                await animateUntilFlag(2, uploadFlag, 1800, 30000);
                if (uploadFlag.error) throw uploadFlag.error;

                // Stage 4: extract faktur pajak — should be ~done by now
                await animateUntilFlag(3, uploadFlag, 1200, 20000);
                if (uploadFlag.error) throw uploadFlag.error;

                // Stage 5: create case (very short)
                await animateUntilFlag(4, uploadFlag, 600, 5000);
                if (uploadFlag.error) throw uploadFlag.error;

                if (!uploadFlag.data) throw new Error("upload did not return a case_id");

                // Use the real backend round-trip — not the total animation time —
                // to decide whether real Gemini did the work.
                setModeBadge(uploadFlag.elapsedMs);

                // Quick GET to surface field count for the success line
                let fieldCount = 0, docCount = 0;
                try {
                    const det = await fetch(`/api/cases/${encodeURIComponent(uploadFlag.data.case_id)}`).then((r) => r.json());
                    docCount = (det.documents || []).length;
                    fieldCount = (det.documents || []).reduce((acc, d) => acc + d.fields.length, 0);
                } catch (_) { /* ignore */ }

                const secs = (uploadFlag.elapsedMs / 1000).toFixed(1);
                resultDetailEl.textContent = `${docCount} document${docCount === 1 ? "" : "s"} · ${fieldCount} fields extracted in ${secs}s. Opening case…`;
                resultEl.classList.remove("hidden");

                await sleep(1200);
                location.href = `case-detail.html?id=${encodeURIComponent(uploadFlag.data.case_id)}`;
            } catch (err) {
                errorDetailEl.textContent = err.message || String(err);
                errorEl.classList.remove("hidden");
            } finally {
                fileInput.value = "";
            }
        });

        document.getElementById("extract-error-close").addEventListener("click", () => {
            overlay.classList.add("hidden");
            newCaseBtn.disabled = false;
        });

        loadQueue();
    </script>

</body>
</html>
